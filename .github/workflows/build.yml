name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # App build: opens the window, no console.
      - run: pyinstaller --onefile --windowed --name PadMaster --icon assets/padlab.ico --add-data "padlab/logo_128.png:padlab" --add-data "padlab/app.html:padlab" --add-data "padlab/gamepadla_latency.json:padlab" run_padlab.py
      # Console build: for debugging (padlab log, check, list).
      - run: pyinstaller --onefile --console --name PadMaster-console --icon assets/padlab.ico --add-data "padlab/logo_128.png:padlab" --add-data "padlab/app.html:padlab" --add-data "padlab/gamepadla_latency.json:padlab" run_padlab.py
      - uses: actions/upload-artifact@v4
        with:
          name: PadMaster-windows
          path: |
            dist/PadMaster.exe
            dist/PadMaster-console.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Only the app goes in the release. The console build stays in the run artefacts for debugging.
          files: dist/PadMaster.exe
