<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>PadMaster</title>
<style>
:root{--bg:#0b0b0c;--panel:#141416;--panel-2:#1b1b1e;--line:#2e2e33;--line-2:#3a3a40;
 --text:#f2f2f5;--text-2:#b9b9c2;--muted:#85858f;--silver:#d9d9de;
 --good:#5fbf3a;--warning:#f0a531;--critical:#e5484d;--nodata:#6b6a72}
*{box-sizing:border-box}
/*PADLAB_SCROLLBAR_CSS*/
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
 font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px}
button,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand img{width:52px;height:52px;border-radius:8px}
.brand .name{font-size:20px;font-weight:600;letter-spacing:.14em}
.brand .tag{font-size:12px;color:var(--muted)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
#padname{flex:1;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;min-width:0;font:inherit;color:inherit}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
select{flex:1;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;min-width:0}
.btn{background:transparent;border:1px solid var(--line-2);border-radius:6px;padding:8px 12px;cursor:pointer}
.btn:hover{background:var(--panel-2);border-color:var(--silver)}
.btn:focus-visible,.big:focus-visible,select:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
#guided{background:#2c2c31;border-color:#4a4a52;color:#f2f2f5;font-weight:600}#guided:hover{background:#3a3a40;border-color:var(--silver)}#guided:disabled{opacity:.5;cursor:default}
.big{width:100%;border:0;border-radius:6px;padding:14px;font-size:16px;font-weight:600;letter-spacing:.14em;cursor:pointer;
 background:var(--silver);color:#0b0b0c}
.big:hover{background:#ffffff}
.big.stop{background:var(--critical);color:#fff}
.big.stop:hover{background:#f05a5f}
.big[disabled]{opacity:.55;cursor:default}
.prompt{border:1px solid var(--line-2);border-radius:8px;padding:16px;text-align:center;background:var(--bg)}
.prompt .msg{color:var(--text-2);font-size:13px;min-height:18px}
.prompt .count{font-size:40px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--text)}
.prompt.live{border-color:var(--good)}
.prompt.err{border-color:var(--critical)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 6px;text-align:center}
.stat .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px}
.links .btn{text-align:left}
.check{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;cursor:pointer}
.latask{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;
 border:2px solid var(--warning);border-left-width:8px;border-radius:10px;background:linear-gradient(90deg,rgba(240,165,49,.16),var(--panel-2) 60%);
 padding:16px 18px;margin-bottom:14px;box-shadow:0 0 0 0 rgba(240,165,49,.6);animation:latpulse 1.6s ease-out 3}
@keyframes latpulse{0%{box-shadow:0 0 0 0 rgba(240,165,49,.55)}100%{box-shadow:0 0 0 14px rgba(240,165,49,0)}}
@media (prefers-reduced-motion:reduce){.latask{animation:none}}
.latask .lq{display:flex;gap:14px;align-items:center}
.latask .li{flex:none;width:38px;height:38px;border-radius:50%;background:var(--warning);color:#0b0b0c;font-weight:800;font-size:22px;display:grid;place-items:center}
.latask .lh{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--warning)}
.latask .lt{font-size:16px;color:var(--text);margin-top:2px}
.latask .lsub{font-size:12px;color:var(--text-2);margin-top:2px}
.latask .la{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.latask .yes{background:var(--silver);color:#0b0b0c;border-color:var(--silver);font-weight:700;padding:9px 18px}
.latask .ls{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;color:var(--text);font:inherit;width:200px}
.latask select{flex:none;max-width:280px}
#tab-report.needs::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warning);margin-left:6px;vertical-align:middle}
.channels{margin-top:auto;position:relative;border-radius:10px;padding:1px;
 background:linear-gradient(135deg,#f5f5f7 0%,#6b6b73 30%,#d9d9de 55%,#4a4a52 80%,#c9c9cf 100%)}
.channels .in{border-radius:9px;background:radial-gradient(120% 90% at 0% 0%,#26262b 0%,#141416 60%);padding:14px;display:flex;flex-direction:column;gap:10px}
.channels .top{display:flex;align-items:center;gap:10px}
.channels .top img{width:40px;height:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.channels .h{font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--text)}
.channels .s{font-size:12px;color:var(--text-2);line-height:1.4}
.channels button{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;
 font-weight:700;font-size:13px;color:#0b0b0c;background:linear-gradient(180deg,#f5f5f7 0%,#c4c4ca 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.5);transition:transform .12s,filter .12s}
.channels button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.channels button:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.channels button .play{width:0;height:0;border-left:8px solid #0b0b0c;border-top:5px solid transparent;border-bottom:5px solid transparent}
.channels button .go{margin-left:auto;font-size:11px;font-weight:600;opacity:.7}
.channels+.foot{margin-top:10px}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;color:var(--text-2);font:inherit;font-size:12px;padding:7px 8px;cursor:pointer}
.tools button:hover{color:var(--text);border-color:var(--silver)}
.autoupd{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:6px}
.upd{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.4}
.upd:empty{display:none}
.upd.new{color:var(--text);background:rgba(201,133,0,.15);border:1px solid var(--warning);border-radius:6px;padding:8px}
.upd a{color:var(--warning);cursor:pointer;text-decoration:underline;font-weight:600}
.foot{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.5}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
nav{display:flex;align-items:center;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 14px;cursor:pointer;color:var(--text-2);
 font-size:12px;letter-spacing:.14em;text-transform:uppercase}
nav button.on{color:var(--text);border-bottom-color:var(--silver)}
nav .spacer{flex:1;min-width:12px}
nav button,nav .btn{flex:none}
nav .note{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{flex:1;min-height:0;overflow:auto}
.view.hidden{display:none}
#report:not(.hidden){display:flex;flex-direction:column}
#report iframe{flex:1;height:auto;min-height:0}
.latask{flex:none}
#history{padding:20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;
 padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
td{padding:10px;border-bottom:1px solid #1f1f23;font-variant-numeric:tabular-nums;white-space:nowrap}
td.dev{white-space:normal}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel)}
tbody tr.sel td{background:var(--panel-2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:600;margin-right:10px}
.pill i{font-style:normal;display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;color:#0b0b0c}
.p-problem i{background:var(--critical);color:#fff}.p-watch i{background:var(--warning)}.p-ok i{background:var(--good)}
.p-zero{color:var(--muted);font-weight:400}
.empty{color:var(--text-2);padding:40px 0;text-align:center;line-height:1.7}
iframe{width:100%;height:100%;border:0;background:var(--bg);display:block}
.rn{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;margin-left:6px;border-radius:4px;font-size:13px}
.rn:hover{color:var(--text);background:var(--panel-2)}
.ck{width:16px;height:16px;accent-color:var(--silver);cursor:pointer;vertical-align:middle}
td.cb,th.cb{width:28px;padding-right:0}
.del{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:13px}
.del:hover{color:#fff;background:var(--critical)}
.model{display:block;font-size:11px;color:var(--muted)}
.rename-in{background:var(--panel-2);border:1px solid var(--silver);border-radius:4px;color:var(--text);font:inherit;padding:4px 6px;width:100%;max-width:280px}
#compare{padding:20px}
#best{padding:20px}
main{position:relative}
#guide{position:absolute;inset:0;z-index:20;background:var(--bg,#0b0b0c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;text-align:center}
#guide.hidden{display:none}
.gstep{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gtext{font-size:30px;font-weight:600;max-width:760px;line-height:1.3}
.gtext.pic{line-height:0}
.gpic{width:260px;height:260px;display:block;margin:0 auto;animation:gpop .16s ease-out}
@keyframes gpop{from{transform:scale(.88);opacity:.4}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.gpic{animation:none}}
.gpic .ol{fill:none;stroke:#f2f2f5;stroke-width:8;stroke-linejoin:round}
.gpic .fl{fill:#f2f2f5}
.gpic .ch{fill:#f2f2f5}
.gpic .dim{fill:none;stroke:#5a5a62;stroke-width:4}
.gpic .dimf{fill:#5a5a62}
.gpic text{font:800 84px "Segoe UI",system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;fill:#0b0b0c}
.gpic text.sm{font-size:52px}
.glabel{font-size:15px;color:var(--text-2,#b9b9c2);margin-top:14px;line-height:1.3}
.gbar{width:min(520px,80%);height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--silver)}
.bcard{border:1px solid var(--line-2);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:var(--panel)}
.bcard.top{border-color:var(--silver)}
.bcard h3{margin:0 0 4px;font-size:16px}
.bcard .pos{display:inline-block;min-width:34px;font-weight:700;color:var(--text-2)}
.bcard .sum{font-size:13px;color:var(--text-2)}
.bcard ul{margin:6px 0 0 18px;padding:0;font-size:13px}
.star{color:#f2f2f5}
.bscore{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px}
.bprice{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 12px}.bprice input{accent-color:#d9d9de;width:180px}.bprice .sub{flex-basis:100%}
.bpr{margin:0 0 6px;font-size:13px;color:var(--text-2,#b9b9c2)}.bpr .pin{width:90px;margin-left:6px;background:#1b1b1e;color:inherit;border:1px solid #2e2e33;border-radius:4px;padding:3px 6px;font:inherit}
.bscore b{font-size:28px}
.bscore span{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.pgrid{display:grid;gap:4px;margin:8px 0 2px;max-width:640px}
.prow{display:grid;grid-template-columns:minmax(150px,240px) 1fr 70px 14px;gap:10px;align-items:center;font-size:12px;color:var(--text-2)}
.prow .pv{text-align:right;color:var(--text)}
.pbar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--silver);border-radius:3px}
.pbar i.g-ok{background:var(--good)}.pbar i.g-watch{background:var(--warning)}.pbar i.g-problem{background:var(--critical)}
.gkey{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-2);margin:0 0 12px}
.gkey span{display:inline-flex;align-items:center;gap:6px}.gkey i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* Chart tab */
.ch-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.ch-bar label{font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:8px}
.ch-bar select{flex:none;min-width:240px}
.ch-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.ch-card h4{margin:0 0 2px;font-size:15px}
.ch-rows{display:grid;gap:6px;margin-top:14px;position:relative}
.ch-row{display:grid;grid-template-columns:minmax(140px,260px) 1fr 84px;gap:12px;align-items:center;font-size:13px;cursor:default;border-radius:4px;padding:2px 0}
.ch-row:hover,.ch-row:focus-visible{background:var(--panel-2);outline:none}
.ch-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.ch-row .v{text-align:right;font-variant-numeric:tabular-nums}
.ch-track{position:relative;height:14px}
.ch-fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--silver);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ch-fill.g-ok{background:var(--good)}.ch-fill.g-watch{background:var(--warning)}.ch-fill.g-problem{background:var(--critical)}
.ch-lim{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--muted);transition:left .45s}
.ch-scat{position:relative;height:420px;margin:18px 8px 34px 56px;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.ch-dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--silver);border:2px solid var(--panel);transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1);cursor:default}
.ch-dot.g-ok{background:var(--good)}.ch-dot.g-watch{background:var(--warning)}.ch-dot.g-problem{background:var(--critical)}
.ch-dot:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.ch-lab{position:absolute;font-size:11px;color:var(--text-2);white-space:nowrap;transform:translate(10px,-50%);pointer-events:none;transition:left .45s,top .45s}
.ch-tick{position:absolute;font-size:11px;color:var(--muted)}
.ch-ax{position:absolute;font-size:12px;color:var(--text-2)}
@media (prefers-reduced-motion:reduce){.ch-fill,.ch-lim,.ch-dot,.ch-lab{transition:none}}
/* Loading animation (owner request, 2026-11-22): silver phosphor CRT. A flat controller with
   scan lines and a soft glow, and a large faint blurred reflection behind it. */
.loading{position:relative;height:260px;overflow:hidden;color:#e9eef3}
/* Scan lines: one screen pixel dark, two clear. --px is one screen pixel (set from devicePixelRatio),
   so the lines stay even with Windows display scaling (owner report, 2026-11-22: uneven lines). */
.loading::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(to bottom,rgba(11,11,12,0) 0,rgba(11,11,12,0) calc(var(--px,1px)*2),rgba(11,11,12,.5) calc(var(--px,1px)*2),rgba(11,11,12,.5) calc(var(--px,1px)*3))}
.loading::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,var(--bg) 100%)}
.loading .lay{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;gap:12px;transform:translate(-50%,-50%)}
.loading .ghost{transform:translate(-46%,-46%) scale(1.08);filter:blur(2.5px);opacity:.15}
.loading .main{animation:crtflick 5s infinite}
.loading svg{width:150px;height:105px}
.loading .main svg{filter:drop-shadow(0 0 4px rgba(225,232,240,.45))}
.loading .body{fill:none;stroke:#eef3f7;stroke-width:3;stroke-linejoin:round}
.loading .fb,.loading .da{fill:#2b2e33;animation:padblink 1.2s infinite}
.loading .fb2{animation-delay:.3s}.loading .fb3{animation-delay:.6s}.loading .fb4{animation-delay:.9s}
.loading .da{animation-duration:1.6s}.loading .da2{animation-delay:.4s}.loading .da3{animation-delay:.8s}.loading .da4{animation-delay:1.2s}
.loading .dc{fill:#8c949c}.loading .stk{fill:none;stroke:#a8b0b8;stroke-width:2.2}
.loading .stk-in{fill:#eef3f7;transform-origin:center;transform-box:fill-box}
.loading .sl{animation:stickl 2.6s ease-in-out infinite}.loading .sr{animation:stickr 1.9s ease-in-out infinite .5s}
@keyframes padblink{0%,60%,100%{fill:#2b2e33}20%{fill:#ffffff}}
@keyframes stickl{0%,100%{transform:translate(0,0)}20%{transform:translate(2.4px,-1px)}45%{transform:translate(1px,2.2px)}70%{transform:translate(-2.2px,.5px)}85%{transform:translate(-1px,-2px)}}
@keyframes stickr{0%,100%{transform:translate(0,0)}30%{transform:translate(-2px,-2px)}55%{transform:translate(2.5px,-.5px)}80%{transform:translate(0,2.4px)}}
@keyframes crtflick{0%,44%,46%,70%,100%{opacity:1}45%{opacity:.8}71%{opacity:.93}}
.loading .txt{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.loading .main .txt{text-shadow:0 0 4px rgba(225,232,240,.45)}
.loading .dots::after{content:"";animation:paddots 1.2s steps(4) infinite}
@keyframes paddots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.loading .scr{display:contents}
@media (prefers-reduced-motion:reduce){.loading .main,.loading .scr,.loading .fb,.loading .da,.loading .stk-in,.loading .dots::after{animation:none}}
.brule{font-size:13px;color:var(--text-2);margin:0 0 14px;max-width:760px}
.cmp-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;cursor:pointer;background:none;color:var(--text);font-size:13px}
.chip .sw{width:10px;height:10px;border-radius:2px}
.chip.off{opacity:.45}
.chip.off .sw{background:transparent!important;border:1px solid var(--muted)}
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.mcard h4{margin:0;font-size:13px;font-weight:600}
.mcard .hint{font-size:11px;color:var(--muted);margin:2px 0 8px}
.mcard svg{display:block;width:100%;overflow:visible}
.mcard svg text{font-family:inherit;font-size:11px;fill:var(--text-2)}
.mcard svg text.v{fill:var(--text);font-weight:600}
.mcard svg g:hover path,.mcard svg g:focus path{filter:brightness(1.25)}
.mcard svg g:focus{outline:none}
.mcard .none{font-size:12px;color:var(--muted);padding:8px 0}
.tip{position:fixed;pointer-events:none;background:#1f1f23;border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.5;display:none;z-index:10;max-width:320px}
.tip b{font-size:14px}
.cmp-table{margin-top:20px}
.cmp-table td,.cmp-table th{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{background:none;border:0;color:var(--text-2);padding:6px 12px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--panel-2);color:var(--text)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;
 padding:10px 14px;font-size:13px;max-width:460px;display:none}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand"><img id="logo" alt="" src=""><div><div class="name">PADMASTER</div><div class="tag">Controller fault logger</div></div></div>

 <div>
  <div class="label">Controller</div>
  <div class="row"><select id="pad" aria-label="Controller"><option>Looking for controllers...</option></select>
  <button class="btn" id="refresh" title="Refresh the controller list" aria-label="Refresh the controller list">&#x21bb;</button></div>
  <div class="label" style="margin-top:10px"><label for="padname">Which controller is this?</label></div>
  <div class="row"><input id="padname" list="padnames" maxlength="60" placeholder="For example: Xbox pad A" autocomplete="off"><datalist id="padnames"></datalist></div>
  <div class="hint">Type a new name, or select a name you used before.</div>
  <div class="label" style="margin-top:10px"><label for="conn">Connection</label></div>
  <div class="row"><select id="conn"><option value="">Not set</option><option>Wired</option><option>Dongle</option><option>Bluetooth</option></select></div>
  <label class="check" style="margin-top:10px;display:block" title="Select this if the trigger stops (short-travel switches) are on. Trigger stops change how the triggers report, so PadMaster does not grade the triggers in this session."><input type="checkbox" id="tstops"> Trigger stops are on</label>
  <label class="check" style="margin-top:10px;display:block" title="For pads that report faster than about 1900 Hz. PadMaster checks for input without a pause, so it keeps one CPU core busy. Games can run slower on some PCs."><input type="checkbox" id="highrate"> High-rate mode (8000 Hz pads)</label>
  <div class="label" style="margin-top:10px"><label for="autostop">Auto stop</label></div>
  <div class="row"><select id="autostop" title="Stop logging when the controller is not used for this time"><option value="0">Off</option><option value="5">After 5 min with no use</option><option value="10">After 10 min with no use</option><option value="20">After 20 min with no use</option><option value="30">After 30 min with no use</option></select></div>
 </div>

 <div class="prompt" id="prompt"><div class="msg" id="msg">Connect the controller. Then push Start.</div><div class="count" id="count">&nbsp;</div></div>

 <div class="stats">
  <div class="stat"><div class="v" id="s-time">0:00</div><div class="k">Time logged</div></div>
  <div class="stat"><div class="v" id="s-inputs">0</div><div class="k">Inputs</div></div>
  <div class="stat"><div class="v" id="s-disc">0</div><div class="k">Disconnects</div></div>
 </div>

 <button class="big" id="go">START</button>
 <button class="btn" id="guided" style="width:100%;margin-top:8px" title="About 4 minutes. Every controller gets the same steps, so results are fair to compare.">Quick Test In-App (about 4 min)</button>

 <div class="links">
  <button class="btn" id="last">Open last report</button>
  <button class="btn" id="folder">Open logs folder</button>
 </div>
 <label class="check"><input type="checkbox" id="ontop"> Always on top</label>

 <div class="channels" id="channels"></div>
 <div class="tools"><button id="bug">Report a bug</button><button id="upd">Check for updates</button></div>
 <label class="autoupd"><input type="checkbox" id="autoupd" checked> Check for updates when PadMaster starts</label>
 <div class="upd" id="updmsg" role="status"></div>
 <div class="foot" id="foot">PadMaster reads the controller only. It does not measure input latency.</div>
</aside>

<main>
 <nav>
  <button id="tab-history" class="on">History</button>
  <button id="tab-compare">Compare</button>
  <button id="tab-best">Best controller</button>
  <button id="tab-chart">Chart</button>
  <button id="tab-report">Report</button>
  <span class="spacer"></span>
  <span class="note" id="note"></span>
  <button class="btn" id="delsel" style="padding:6px 10px;font-size:12px;letter-spacing:0;text-transform:none;display:none">Delete selected</button>
  <button class="btn" id="export" style="padding:6px 10px;font-size:12px;letter-spacing:0;text-transform:none">Export history</button>
  <button class="btn" id="browser" style="padding:6px 10px;font-size:12px;letter-spacing:0;text-transform:none;display:none">Open in browser</button>
 </nav>
 <div class="view" id="history"></div>
 <div class="view hidden" id="compare"></div>
 <div class="view hidden" id="best"></div>
 <div class="view hidden" id="chart"></div>
 <div id="guide" class="hidden" role="status" aria-live="assertive"><div class="gstep" id="gstep"></div><div class="gtext" id="gtext"></div><div class="gbar"><i id="gbar"></i></div><button class="btn" id="gstop">Stop the test</button></div>
 <div class="view hidden" id="report"><div class="empty">Select a session in History to see its report.</div></div>
</main>
</div>
<div class="toast" id="toast"></div><div class="tip" id="tip"></div>

<script>
const $ = id => document.getElementById(id);
let api = null, rows = [], current = null, poll = null, countdown = 0, cdTimer = null, state = "idle", picked = new Set();

function esc(s){return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function clock(sec){sec=Math.floor(sec||0);const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60,s=sec%60;
 return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`;}
function toast(t){if(!t)return;const el=$("toast");el.textContent=t;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",5000);}
function when(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return iso;
 return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+"  "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}

function setScreenPixel(){document.documentElement.style.setProperty("--px",(1/(window.devicePixelRatio||1))+"px");}
setScreenPixel();window.addEventListener("resize",setScreenPixel);
function loader(text){
 const art=`<svg viewBox="0 0 100 70" aria-hidden="true">
  <path class="body" d="M30 8H70C82 8 88 12 91 22L97 50C99 63 87 69 79 60L71 51C66 48 34 48 29 51L21 60C13 69 1 63 3 50L9 22C12 12 18 8 30 8Z"/>
  <rect class="dc" x="23.5" y="22.5" width="4" height="4"/>
  <rect class="da" x="23.5" y="17.6" width="4" height="4.6" rx="1"/><rect class="da da2" x="27.8" y="22.5" width="4.6" height="4" rx="1"/>
  <rect class="da da3" x="23.5" y="26.8" width="4" height="4.6" rx="1"/><rect class="da da4" x="18.6" y="22.5" width="4.6" height="4" rx="1"/>
  <circle class="fb" cx="74" cy="18" r="3.5"/><circle class="fb fb2" cx="81" cy="24.5" r="3.5"/><circle class="fb fb3" cx="74" cy="31" r="3.5"/><circle class="fb fb4" cx="67" cy="24.5" r="3.5"/>
  <circle class="stk" cx="38" cy="38" r="6.2"/><circle class="stk-in sl" cx="38" cy="38" r="3.2"/>
  <circle class="stk" cx="62" cy="38" r="6.2"/><circle class="stk-in sr" cx="62" cy="38" r="3.2"/></svg><div class="txt">${esc(text)}<span class="dots"></span></div>`;
 return `<div class="loading" role="status"><div class="lay ghost" aria-hidden="true">${art}</div><div class="lay main">${art}</div></div>`;
}

function showTab(name){
 for(const t of ["history","compare","best","chart","report"]){$("tab-"+t).classList.toggle("on",name===t);$(t).classList.toggle("hidden",name!==t);}
 if(name==="compare")renderCompare();
 if(name==="best")renderBest();
 if(name==="chart")renderChart();
 $("export").style.display=name==="history"?"":"none";if(typeof syncPicked==="function"&&$("ckall"))syncPicked();else $("delsel").style.display="none";$("browser").style.display=name==="report"&&current?"":"none";
}

function pills(r){
 const p=(n,c,i,l)=>n?`<span class="pill p-${c}"><i>${i}</i>${n} ${l}</span>`:"";
 const s=p(r.problem,"problem","✕","Problem")+p(r.watch,"watch","!","Watch")+p(r.ok,"ok","✓","OK");
 return s||'<span class="p-zero">No results</span>';
}

function renderHistory(){
 if(!rows.length){$("history").innerHTML='<div class="empty">No sessions yet.<br>Push Start to log your first session.</div>';return;}
 let h='<table><thead><tr><th class="cb"><input type="checkbox" class="ck" id="ckall" aria-label="Select all sessions"></th><th>Date</th><th>Controller</th><th>Length</th><th>Inputs</th><th>Disconnects</th><th>Results</th><th></th></tr></thead><tbody>';
 for(const r of rows){
  h+=`<tr data-log="${esc(r.log_file)}" class="${current===r.log_file?"sel":""}"><td class="cb"><input type="checkbox" class="ck" aria-label="Select this session" ${picked.has(r.log_file)?"checked":""}></td><td>${esc(when(r.started))}</td><td class="dev"><span class="dn">${esc(r.device)}</span><button class="rn" title="Rename this controller (all its sessions)" aria-label="Rename this controller and all its sessions">&#x270E;</button>${(r.model&&r.model!==r.device)||r.connection?`<span class="model">${esc([r.connection,r.model!==r.device?r.model:""].filter(Boolean).join(" · "))}</span>`:""}</td>`+
     `<td>${clock(r.duration_s)}</td><td>${Number(r.inputs||0).toLocaleString("en-GB")}</td><td>${r.disconnects??""}</td><td>${r.error?"Unreadable log":pills(r)}</td><td><button class="del" title="Delete this session" aria-label="Delete this session">&#x1F5D1;</button></td></tr>`;
 }
 $("history").innerHTML=h+"</tbody></table>";
 $("note").textContent=`${rows.length} session${rows.length===1?"":"s"} in ${initData.out_dir}`;
 for(const tr of $("history").querySelectorAll("tbody tr")){
  tr.onclick=()=>openReport(tr.dataset.log);
  tr.querySelector(".rn").onclick=ev=>{ev.stopPropagation();startRename(tr);};
  const ck=tr.querySelector(".ck");ck.onclick=ev=>{ev.stopPropagation();ck.checked?picked.add(tr.dataset.log):picked.delete(tr.dataset.log);syncPicked();};
  tr.querySelector(".del").onclick=ev=>{ev.stopPropagation();deleteSessions([tr.dataset.log]);};
 }
 $("ckall").onclick=ev=>{ev.stopPropagation();if(ev.target.checked)rows.forEach(r=>picked.add(r.log_file));else picked.clear();renderHistory();};
 syncPicked();
}
function syncPicked(){
 for(const k of [...picked])if(!rows.some(r=>r.log_file===k))picked.delete(k);
 const n=picked.size,b=$("delsel");b.textContent=`Delete selected (${n})`;b.style.display=n&&!$("history").classList.contains("hidden")?"":"none";
 const all=$("ckall");if(all){all.checked=n>0&&n===rows.length;all.indeterminate=n>0&&n<rows.length;}
}
async function checkUpdate(auto){
 const m=$("updmsg");if(!auto){m.className="upd";m.textContent="Checking...";}
 const r=await api.check_update(auto);
 if(r.state==="update"){m.className="upd new";
  m.innerHTML=`PadMaster ${esc(r.latest)} is available. You have ${esc(r.current)}. `+(r.in_place?`<a id="doupd">Update now</a> or <a id="getupd">see what is new</a>`:`<a id="getupd">Download it</a>`);
  $("getupd").onclick=()=>api.open_link(r.url);
  if(r.in_place)$("doupd").onclick=async()=>{m.textContent="Downloading the update...";const u=await api.update_now();m.textContent=u.message;};}
 else if(auto){return;}
 else if(r.state==="latest"){m.textContent=`You have the latest version (${r.current}).`;}
 else{m.textContent=r.message||"";}
}
async function deleteSessions(list){
 if(!list.length)return;
 const msg=list.length===1?"Delete this session?":`Delete ${list.length} sessions?`;
 if(!confirm(msg+" PadMaster moves the log and the report to the Deleted folder in your logs folder. To restore a session, move its files back."))return;
 const r=await api.delete_sessions(list);
 rows=r.history;cmpData=null;list.forEach(k=>picked.delete(k));
 if(list.includes(current)){current=null;currentPath=null;$("report").innerHTML='<div class="empty">Select a session in History to see its report.</div>';}
 renderHistory();toast(`${r.moved} session${r.moved===1?"":"s"} moved to the Deleted folder.`);
}

async function openReport(log){
 current=log;renderHistory();showTab("report");
 $("report").innerHTML=loader("Making the report");
 const res=await api.report_html(log);
 if(!res.ok){$("report").innerHTML=`<div class="empty">${esc(res.message)}</div>`;return;}
 current=log;currentPath=res.path;
 const f=document.createElement("iframe");f.setAttribute("sandbox","allow-same-origin");f.srcdoc=res.html;
 f.onload=()=>{try{f.contentDocument.addEventListener("click",ev=>{const a=ev.target.closest("a[href]");
  if(a&&/^https?:/i.test(a.getAttribute("href"))){ev.preventDefault();api.open_link(a.getAttribute("href"));}});}catch(e){}};
 $("report").innerHTML="";$("report").appendChild(f);$("browser").style.display="";
 latencyAsk(log);
}
async function latencyAsk(log){
 $("tab-report").classList.remove("needs");
 const st=await api.latency_status(log);
 if(!st.ok||st.state!=="ask"||current!==log)return;
 $("report").querySelectorAll(".latask").forEach(b=>b.remove());
 $("tab-report").classList.remove("needs");
 const box=document.createElement("div");box.className="latask";
 const top=st.suggest&&st.suggest[0];
 const opts=(list)=>list.map(c=>`<option value="${esc(c.url)}">${esc(c.name)}</option>`).join("");
 box.setAttribute("role","alert");$("tab-report").classList.add("needs");
 box.innerHTML=`<div class="lq"><div class="li" aria-hidden="true">?</div><div>
  <div class="lh">Answer to see hardware latency</div>
  <div class="lt">${top?`Is <b>${esc(st.controller)}</b> the <b>${esc(top.name)}</b>?`:`Which Gamepadla model is <b>${esc(st.controller)}</b>?`}</div>
  <div class="lsub">Latency data from Gamepadla.com. Choose the exact model, or select No latency data.</div></div></div>
  <div class="la">${top?`<button class="btn yes">Yes</button>`:""}
  <input class="ls" placeholder="Search Gamepadla models" aria-label="Search Gamepadla models">
  <select class="lsel" aria-label="Choose another model"><option value="">Choose another...</option>${opts(st.suggest||[])}</select>
  <button class="btn no">No latency data</button></div>`;
 $("report").prepend(box);
 const choose=async url=>{$("tab-report").classList.remove("needs");box.innerHTML='<div class="lq">Saving...</div>';const r=await api.latency_choose(log,url);
  if(!r.ok){toast(r.message);box.remove();return;}openReport(log);};
 if(top)box.querySelector(".yes").onclick=()=>choose(top.url);
 box.querySelector(".no").onclick=()=>choose("none");
 box.querySelector(".lsel").onchange=ev=>{if(ev.target.value)choose(ev.target.value);};
 let tmr=null;box.querySelector(".ls").oninput=ev=>{clearTimeout(tmr);tmr=setTimeout(async()=>{
  const list=await api.latency_search(ev.target.value);
  box.querySelector(".lsel").innerHTML=`<option value="">Choose (${list.length})...</option>`+opts(list);},250);};
}
let currentPath=null, initData={};

function grp(s){return s.connection?`${s.device} · ${s.connection}`:s.device;}

async function loadPadNames(){
 const r=await api.pad_names();
 $("padnames").innerHTML=r.names.map(n=>`<option value="${esc(n)}"></option>`).join("");
 if(!$("padname").value)$("padname").value=r.last||"";
 if(!$("conn").dataset.set){$("conn").value=r.last_connection||"";$("conn").dataset.set="1";}
 if(!$("tstops").dataset.set){$("tstops").checked=!!r.trigger_stops;$("tstops").dataset.set="1";}
 if(!$("highrate").dataset.set){$("highrate").checked=!!r.high_rate;$("highrate").dataset.set="1";}
 if(!$("autostop").dataset.set){$("autostop").value=String(r.auto_stop_min??10);if(!$("autostop").value)$("autostop").value="10";$("autostop").dataset.set="1";}
}

async function loadDevices(){
 $("pad").innerHTML="<option>Looking for controllers...</option>";
 const devs=await api.devices();
 if(!devs.length){$("pad").innerHTML='<option value="0">No controller found. Connect one and push refresh.</option>';return;}
 $("pad").innerHTML=devs.map(d=>`<option value="${d.index}">${esc(d.name)}${d.mapped?"":" (not mapped)"}</option>`).join("");
}

function setPrompt(msg,count,cls){$("msg").textContent=msg;$("count").innerHTML=count===""?"&nbsp;":esc(count);
 $("prompt").className="prompt"+(cls?" "+cls:"");}

function setBusy(running){
 $("go").textContent=running?"STOP":"START";$("go").classList.toggle("stop",running);
 $("pad").disabled=running;$("padname").disabled=running;$("conn").disabled=running;$("refresh").disabled=running;
}

let guidedRun=false;
// Prompt pictures: a D-pad with the asked direction(s) lit, or the face and shoulder buttons with one lit.
const DIRS={dpad_up:["up"],dpad_down:["down"],dpad_left:["left"],dpad_right:["right"],dpad_upleft:["up","left"],dpad_upright:["up","right"],dpad_downleft:["down","left"],dpad_downright:["down","right"]};
const DIRNAME={up:"Up",down:"Down",left:"Left",right:"Right"};
function dpadSvg(on){
 // One cross with a thick outline. The asked arm(s) are filled. Chevrons outside show the direction.
 const c=130,h=30,e=42,E=218;
 const cross=`M${c-h} ${e}H${c+h}V${c-h}H${E}V${c+h}H${c+h}V${E}H${c-h}V${c+h}H${e}V${c-h}H${c-h}Z`;
 const g=c-h+10,G=c+h-10; // lit arms stop short of the centre square
 const arm={up:`M${c-h} ${e}H${c+h}V${g}H${c-h}Z`,down:`M${c-h} ${G}H${c+h}V${E}H${c-h}Z`,
  left:`M${e} ${c-h}H${g}V${c+h}H${e}Z`,right:`M${G} ${c-h}H${E}V${c+h}H${G}Z`};
 const ang={up:0,right:90,down:180,left:270};
 let s='<svg class="gpic" viewBox="0 0 260 260" aria-hidden="true">';
 for(const d of on)s+=`<path class="fl" d="${arm[d]}"/>`;
 s+=`<path class="ol" d="${cross}"/>`;
 const deg=on.length===2?(ang[on[0]]+ang[on[1]]+((on.includes("up")&&on.includes("left"))?360:0))/2:ang[on[0]];
 const r=on.length===2?118:121;
 s+=`<g transform="rotate(${deg} 130 130)"><path class="ch" d="M130 ${130-r}l-14 16h28z"/></g>`;
 return s+"</svg>";
}
function buttonSvg(key){
 // Only the asked button, large. Face buttons also show their position as a small diamond of dots.
 if(key==="btn_lb"||key==="btn_rb"){
  const left=key==="btn_lb";
  const shape="M40 96Q40 62 80 56L190 44Q224 40 224 76V170Q224 196 198 196H66Q40 196 40 170Z";
  return `<svg class="gpic" viewBox="0 0 260 260" aria-hidden="true"><path class="fl" d="${shape}" transform="${left?"":"translate(260 0) scale(-1 1)"}"/><text class="sm" x="132" y="130">${left?"LB":"RB"}</text></svg>`;
 }
 const pos={btn_y:[0,-1],btn_x:[-1,0],btn_b:[1,0],btn_a:[0,1]};
 const t={btn_y:"Y",btn_x:"X",btn_b:"B",btn_a:"A"}[key];
 let s=`<svg class="gpic" viewBox="0 0 260 260" aria-hidden="true"><circle class="fl" cx="130" cy="108" r="84"/><text x="130" y="110">${t}</text>`;
 for(const k in pos){const [dx,dy]=pos[k],x=130+dx*16,y=232+dy*16;
  s+=k===key?`<circle class="ch" cx="${x}" cy="${y}" r="8"/>`:`<circle class="dim" cx="${x}" cy="${y}" r="6"/>`;}
 return s+"</svg>";
}
function showGuide(p){
 if(!p){$("guide").classList.add("hidden");return;}
 $("guide").classList.remove("hidden");
 const game=!p.key.startsWith("phase_")&&p.key!=="end";
 $("gstep").textContent=p.key.startsWith("phase_")?`Guided test: step ${["phase_rest","phase_circles_slow","phase_circles_fast","phase_edges","phase_triggers","phase_game"].indexOf(p.key)+1} of 6`:(game?"Press what you see":"Guided test");
 if(game){
  const isD=p.key.startsWith("dpad_");
  const label=isD?"D-pad: "+DIRS[p.key].map(d=>DIRNAME[d]).join(" + "):p.text;
  $("gtext").className="gtext pic";$("gtext").innerHTML=(isD?dpadSvg(DIRS[p.key]):buttonSvg(p.key))+`<div class="glabel">${esc(label)}</div>`;
  $("gtext").setAttribute("aria-label",label);
 }else{$("gtext").className="gtext";$("gtext").textContent=p.text;$("gtext").removeAttribute("aria-label");}
 $("gbar").style.width=Math.round(100*(p.i+1)/p.n)+"%";
}
async function start(guided){
 guided=guided===true;
 const r=await api.start(parseInt($("pad").value||"0",10),$("padname").value.trim(),$("conn").value,parseFloat($("autostop").value||"0"),guided,$("highrate").checked,$("tstops").checked);
 if(!r.ok){toast(r.message);return;}
 state="running";setBusy(true);guidedRun=guided;$("guided").disabled=true;
 $("s-time").textContent="0:00";$("s-inputs").textContent="0";$("s-disc").textContent="0";
 countdown=guided?0:10;setPrompt(guided?"Guided test. Follow the steps on the screen.":"Put the controller down.",guided?"":countdown);
 clearInterval(cdTimer);cdTimer=setInterval(()=>{countdown--;if(countdown<=0){clearInterval(cdTimer);}},1000);
 clearInterval(poll);poll=setInterval(tick,guided?150:500);
}

async function stop(){$("go").disabled=true;await api.stop();setPrompt("Making the report...","");}

async function tick(){
 const s=await api.status();
 if(s.state==="waiting"){setPrompt("Waiting for the controller...","");return;}
 if(s.state==="logging"||s.state==="stopping"||s.state==="starting"){
  if(s.t!==undefined){$("s-time").textContent=clock(s.t);}
  if(s.inputs!==undefined){$("s-inputs").textContent=Number(s.inputs).toLocaleString("en-GB");}
  if(s.disconnects!==undefined){$("s-disc").textContent=s.disconnects;}
  if(guidedRun)showGuide(s.state==="stopping"?null:s.prompt);
  if(s.state==="stopping"){setPrompt("Making the report...","");}
  else if(guidedRun&&s.connected!==false){setPrompt("Guided test. Follow the steps on the screen.","●",'live');}
  else if(s.connected===false){setPrompt("Controller lost. Turn it on again.","",'err');}
  else if(countdown>0){setPrompt("Put the controller down.",countdown);}
  else{setPrompt("Logging. Play your game.","●",'live');}
  return;
 }
 clearInterval(poll);clearInterval(cdTimer);state="idle";setBusy(false);$("go").disabled=false;
 guidedRun=false;showGuide(null);$("guided").disabled=false;
 if(s.state==="done"){loadPadNames();
  setPrompt(s.auto_stopped?"Logging stopped: the controller was not used. Report ready.":"Report ready.","");rows=await api.history();cmpData=null;renderHistory();
  if(s.log){const name=s.log.split(/[\\/]/).pop();openReport(name);}
 }else if(s.state==="error"){setPrompt(s.message||"Logging stopped with an error.","",'err');}
}

function startRename(tr){
 const cell=tr.querySelector(".dev"),log=tr.dataset.log,row=rows.find(r=>r.log_file===log);
 const inp=document.createElement("input");inp.className="rename-in";inp.maxLength=60;inp.value=row.device;
 inp.setAttribute("aria-label","Session name");
 cell.innerHTML="";cell.appendChild(inp);inp.focus();inp.select();
 let done=false;
 const finish=async save=>{if(done)return;done=true;
  if(save&&inp.value.trim()!==row.device){const r=await api.rename(log,inp.value);
   if(!r.ok){toast(r.message);}else{rows=r.history;cmpData=null;$("padname").value="";loadPadNames();toast(r.name?`All sessions from this controller are now ${r.name}.`:"The model name is back for all sessions from this controller.");
    if(current===log)openReport(log);}}
  renderHistory();};
 inp.onclick=ev=>ev.stopPropagation();
 inp.onkeydown=ev=>{if(ev.key==="Enter")finish(true);if(ev.key==="Escape")finish(false);};
 inp.onblur=()=>finish(true);
}

const PALETTE=["#3987e5","#d95926","#199e70","#c98500","#d55181","#0ca30c","#9085e9","#e66767"];
let cmpData=null,cmpOff=new Set(),cmpMode="median";
function cmpColour(names){const m={};names.forEach((n,i)=>m[n]=i<PALETTE.length?PALETTE[i]:"#85858f");return m;}
function fmt(m,v){if(v==null||isNaN(v))return"-";const x=m.pct?v*100:v;
 if(m.unit==="count")return String(Math.round(x));if(m.unit==="Hz")return Math.round(x)+" Hz";
 if(m.unit==="bits")return(x>=12?"12+":x.toFixed(1))+" bits";if(m.unit==="ms")return x.toFixed(1)+" ms";return x.toFixed(1)+"%";}
function median(a){const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;}
function tipShow(ev,html){const t=$("tip");t.innerHTML=html;t.style.display="block";
 const x=Math.min(ev.clientX+14,window.innerWidth-t.offsetWidth-8),y=Math.min(ev.clientY+14,window.innerHeight-t.offsetHeight-8);
 t.style.left=x+"px";t.style.top=y+"px";}
function tipHide(){$("tip").style.display="none";}

async function renderCompare(){
 if(!cmpData){$("compare").innerHTML=loader("Loading");cmpData=await api.compare_data();}
 const sessions=cmpData.sessions.filter(s=>s.metrics);
 if(!sessions.length){$("compare").innerHTML='<div class="empty">No sessions to compare yet.</div>';return;}
 const names=[];for(const s of [...sessions].reverse())if(!names.includes(grp(s)))names.push(grp(s));
 const col=cmpColour(names);
 const shown=names.filter(n=>!cmpOff.has(n));
 let h='<div class="cmp-bar">';
 for(const n of names)h+=`<button class="chip${cmpOff.has(n)?" off":""}" data-n="${esc(n)}" aria-pressed="${!cmpOff.has(n)}"><span class="sw" style="background:${col[n]}"></span>${esc(n)}</button>`;
 h+=`<div class="seg" role="group" aria-label="Value per controller"><button data-m="median" class="${cmpMode==="median"?"on":""}">Median of sessions</button><button data-m="latest" class="${cmpMode==="latest"?"on":""}">Latest session</button></div></div>`;
 h+='<div class="cmp-grid">';
 const tableRows=[];
 for(const m of cmpData.metrics){
  const items=[];
  for(const n of shown){
   const ss=sessions.filter(s=>grp(s)===n&&s.metrics[m.key]!=null);
   if(!ss.length)continue;
   const vals=ss.map(s=>s.metrics[m.key]);
   items.push({n,v:cmpMode==="latest"?ss[0].metrics[m.key]:median(vals),vals,ss});
  }
  tableRows.push({m,items});
  h+=`<div class="mcard"><h4>${esc(m.label)}</h4><div class="hint">${m.ok_value==null?"Information only.":(m.better==="low"?"Lower is better. Dashed lines: OK and Watch limits.":"Higher is better. Dashed lines: OK and Watch limits.")}</div>`;
  h+=items.length?barSvg(m,items,col)+"</div>":'<div class="none">No result for these controllers.</div></div>';
 }
 h+="</div>";
 h+='<details class="cmp-table"><summary style="cursor:pointer;color:var(--text-2)">Show as a table</summary><table><thead><tr><th>Check</th>'+shown.map(n=>`<th>${esc(n)}</th>`).join("")+"</tr></thead><tbody>";
 for(const {m,items} of tableRows){h+=`<tr><td>${esc(m.label)}</td>`+shown.map(n=>{const it=items.find(i=>i.n===n);return`<td>${it?fmt(m,it.v):"-"}</td>`;}).join("")+"</tr>";}
 h+="</tbody></table></details>";
 $("compare").innerHTML=h;
 for(const c of $("compare").querySelectorAll(".chip"))c.onclick=()=>{const n=c.dataset.n;cmpOff.has(n)?cmpOff.delete(n):cmpOff.add(n);renderCompare();};
 for(const b of $("compare").querySelectorAll(".seg button"))b.onclick=()=>{cmpMode=b.dataset.m;renderCompare();};
 for(const g of $("compare").querySelectorAll("[data-tip]")){
  g.addEventListener("pointermove",ev=>tipShow(ev,g.dataset.tip));g.addEventListener("pointerleave",tipHide);
  g.addEventListener("focus",()=>{const r=g.getBoundingClientRect();tipShow({clientX:r.right-60,clientY:r.top},g.dataset.tip);});
  g.addEventListener("blur",tipHide);
 }
}

async function renderBest(){
 $("best").innerHTML=loader("Ranking the controllers");
 const d=await api.best_data(),byKey={};for(const m of d.metrics)byKey[m.key]=m;
 const rk=d.ranking;
 if(!rk.length){$("best").innerHTML='<div class="empty">No sessions to rank yet.</div>';return;}
 const lab=k=>esc(byKey[k].label),val=(c,k)=>fmt(byKey[k],c.values[k]);
 const w=d.price_points||0,on=rk.some(c=>c.points>0),dw=d.price_points_default||0;
 let h=`<div class="bprice"><label for="pw">Price rule: <b id="pwv">${w}</b> points for each price doubling</label><input id="pw" type="range" min="0" max="20" step="1" value="${w}">${w!==dw?`<button id="pwreset">Use the default (${dw})</button>`:""}<span class="sub">${on?"":"The price rule is not used yet: add a price to at least two controllers. "}The bar goes up with the price. Value score = performance score - price bar. The cheapest controller has no price bar. For each doubling of the price, a controller must be ${w} performance points better to tie. So a very good cheap controller can beat an expensive controller that is only as good as its price leads you to expect. 0 ranks by performance only. Controllers without a price are not ranked when the rule is on.</span></div>`;
 h+='<div class="gkey"><span><i style="background:var(--good)"></i>OK</span><span><i style="background:var(--warning)"></i>Watch</span><span><i style="background:var(--critical)"></i>Problem</span><span><i style="background:var(--silver)"></i>No limit (information)</span><span>Bar length: performance score of the check</span></div>';
 h+='<p class="brule">How PadMaster ranks: each controller gets the median of its sessions for each check. The performance score (0 to 100) is the mean of the performance checks: update rate, update interval spread, stick resolution, outer reach, circularity, centre deadzone and trigger start deadzone. 100 is the best possible value. 0 is the Watch limit (for the update rate: 125 Hz is 0, 2000 Hz is 100, about the fastest rate PadMaster can measure). The highest score is first. Faults (Problem and Watch) are shown for each controller and decide a tie. The limits are PadMaster defaults, not industry standards. Compare controllers only with the same player, game and connection.</p>';
 if(rk.filter(c=>c.ranked).length<2)h+='<p class="brule">Log at least two controllers to get a ranking.</p>';
 for(const c of rk){
  const st=c.problems.length?"Problem":c.watch.length?"Watch":"OK";
  const pk=Object.keys(c.perf);
  h+=`<div class="bcard${c.rank===1&&rk.filter(x=>x.ranked).length>1?" top":""}"><h3><span class="pos">${c.rank?"#"+c.rank:"-"}</span>${esc(c.name)}</h3>`;
  h+=c.points>0?`<div class="bscore"><b>${c.overall==null?"-":Math.round(c.overall)}</b><span>Value score</span></div><div class="sum">Performance score ${c.score==null?"-":Math.round(c.score)}. Price bar ${c.price_bar==null?"-":"-"+(+c.price_bar).toFixed(1)}.</div>`
   :`<div class="bscore"><b>${c.score==null?"-":Math.round(c.score)}</b><span>Performance score</span></div>`;
  h+=`<div class="bpr"><label>Price <input class="pin" data-n="${esc(c.name)}" inputmode="decimal" placeholder="none" value="${c.price??""}"></label></div>`;
  h+=`<div class="sum">${c.ranked?"":(c.points>0&&c.price==null&&c.score!=null?"Not ranked: add a price. ":"Not ranked: too few checks have a result. ")}${c.sessions} session${c.sessions===1?"":"s"}. Faults: ${c.problems.length} Problem, ${c.watch.length} Watch (worst result: ${st}).</div>`;
  if(pk.length){h+='<div class="pgrid">';for(const k of pk)h+=`<div class="prow" title="${lab(k)}: ${val(c,k)}, score ${Math.round(c.perf[k])}"><span>${lab(k)}</span><span class="pbar"><i class="${c.grades[k]?"g-"+c.grades[k]:""}" style="width:${c.perf[k]}%"></i></span><span class="pv">${val(c,k)}</span><span class="star"${c.wins.includes(k)?' title="Better than all other controllers">&#9733;':' aria-hidden="true">'}</span></div>`;h+="</div>";}
  h+="<ul>";
  for(const k of c.problems)h+=`<li>Problem: ${lab(k)} (${val(c,k)})</li>`;
  for(const k of c.watch)h+=`<li>Watch: ${lab(k)} (${val(c,k)})</li>`;
  h+="</ul></div>";
 }
 $("best").innerHTML=h;
 if($("pwreset"))$("pwreset").onclick=async()=>{await api.set_price_points(dw);renderBest();};
 $("pw").oninput=e=>$("pwv").textContent=e.target.value;
 $("pw").onchange=async e=>{await api.set_price_points(+e.target.value);renderBest();};
 $("best").querySelectorAll(".pin").forEach(i=>i.onchange=async()=>{const r=await api.set_price(i.dataset.n,i.value);if(!r.ok)toast(r.message);renderBest();});
}

let chartX="score",chartY="";
async function renderChart(){
 if(!$("chart").dataset.ready)$("chart").innerHTML=loader("Loading");
 const d=await api.best_data(),rk=d.ranking.filter(c=>c.sessions);
 if(!rk.length){$("chart").innerHTML='<div class="empty">No sessions yet. Log a controller first.</div>';return;}
 const ms={score:{key:"score",label:"Performance score",unit:"",better:"high",pct:false,score:true},
  overall:{key:"overall",label:"Value score (performance with the price rule)",unit:"",better:"high",pct:false,score:true},
  price:{key:"price",label:"Price",unit:"",better:"low",pct:false}};
 for(const m of d.metrics)ms[m.key]=m;
 const val=(c,k)=>k==="score"?c.score:k==="overall"?c.overall:k==="price"?c.price:c.values[k];
 const show=(m,v)=>v==null||isNaN(v)?"-":m.score?String(Math.round(v)):m.key==="price"?(+v).toFixed(2):fmt(m,v);
 const gradeOf=(c,k)=>(k==="score"||k==="overall")?(c.problems.length?"g-problem":c.watch.length?"g-watch":"g-ok"):c.grades&&c.grades[k]?"g-"+c.grades[k]:"";
 if(!ms[chartX])chartX="score";if(chartY&&!ms[chartY])chartY="";
 const opts=sel=>Object.values(ms).map(m=>`<option value="${esc(m.key)}"${m.key===sel?" selected":""}>${esc(m.label)}</option>`).join("");
 let h=`<div class="ch-bar"><label>Show <select id="chx">${opts(chartX)}</select></label>
  <label>Against <select id="chy"><option value="">Nothing (bar chart)</option>${opts(chartY)}</select></label></div>`;
 const mx=ms[chartX];
 h+='<div class="gkey"><span><i style="background:var(--good)"></i>OK</span><span><i style="background:var(--warning)"></i>Watch</span><span><i style="background:var(--critical)"></i>Problem</span><span><i style="background:var(--silver)"></i>No limit</span></div>';
 h+=`<div class="ch-card" id="chcard"></div>`;
 if(!$("chart").dataset.ready){$("chart").innerHTML=h;$("chart").dataset.ready="1";}
 else{$("chx").innerHTML=opts(chartX);$("chy").innerHTML='<option value="">Nothing (bar chart)</option>'+opts(chartY);}
 $("chx").onchange=e=>{chartX=e.target.value;renderChart();};
 $("chy").onchange=e=>{chartY=e.target.value;renderChart();};
 const card=$("chcard");
 const k=mx.pct?100:1;
 if(!chartY){
  const items=rk.map(c=>({c,v:val(c,chartX)})).filter(i=>i.v!=null&&!isNaN(i.v));
  items.sort((a,b)=>mx.better==="low"?a.v-b.v:b.v-a.v);
  const lims=[mx.ok_value,mx.watch_value].filter(x=>x!=null).map(x=>x*k);
  let max=Math.max(...items.map(i=>i.v*k),...lims,mx.score?100:0);if(!(max>0))max=1;max*=1.05;
  const hint=mx.score?"0 to 100. Higher is better. Bar colour: the worst result of the controller.":mx.key==="price"?"The price you typed in Best controller.":mx.ok_value==null?"Information only.":(mx.better==="low"?"Lower is better. Dashed lines: OK and Watch limits.":"Higher is better. Dashed lines: OK and Watch limits.");
  if(!card.querySelector(".ch-rows")||card.dataset.mode!=="bar"){card.dataset.mode="bar";card.innerHTML='<h4></h4><div class="hint"></div><div class="ch-rows"></div><div class="none hidden"></div>';}
  card.querySelector("h4").textContent=mx.label;card.querySelector(".hint").textContent=hint;
  const box=card.querySelector(".ch-rows"),none=card.querySelector(".none");
  none.classList.toggle("hidden",!!items.length);none.textContent="No controller has a result for this yet.";
  const keep=new Map([...box.children].map(r=>[r.dataset.n,r]));
  items.forEach((it,i)=>{
   let r=keep.get(it.c.name);
   if(!r){r=document.createElement("div");r.className="ch-row";r.tabIndex=0;r.dataset.n=it.c.name;
    r.innerHTML='<span class="nm"></span><span class="ch-track"><i class="ch-fill" style="width:0"></i></span><span class="v"></span>';}
   keep.delete(it.c.name);box.appendChild(r);
   r.querySelector(".nm").textContent=(it.c.rank?"#"+it.c.rank+"  ":"")+it.c.name;
   r.querySelector(".v").textContent=show(mx,it.v);
   const f=r.querySelector(".ch-fill");f.className="ch-fill "+gradeOf(it.c,chartX);
   requestAnimationFrame(()=>{f.style.width=(100*it.v*k/max)+"%";});
   r.querySelectorAll(".ch-lim").forEach(x=>x.remove());
   for(const L of lims){const l=document.createElement("i");l.className="ch-lim";l.style.left=(100*L/max)+"%";r.querySelector(".ch-track").appendChild(l);}
   const tip=`<b>${esc(it.c.name)}</b><br>${esc(mx.label)}: ${esc(show(mx,it.v))}<br><span style="color:#85858f">${it.c.sessions} session${it.c.sessions===1?"":"s"}${it.c.rank?", rank #"+it.c.rank:""}</span>`;
   r.onmousemove=e=>tipShow(e,tip);r.onmouseleave=tipHide;r.onfocus=e=>{const b=r.getBoundingClientRect();tipShow({clientX:b.right-120,clientY:b.top},tip);};r.onblur=tipHide;
  });
  for(const r of keep.values())r.remove();
  return;
 }
 // Scatter: one dot per controller.
 const my=ms[chartY],ky=my.pct?100:1;
 const items=rk.map(c=>({c,x:val(c,chartX),y:val(c,chartY)})).filter(i=>i.x!=null&&!isNaN(i.x)&&i.y!=null&&!isNaN(i.y));
 card.dataset.mode="scatter";
 if(!items.length){card.innerHTML=`<h4>${esc(mx.label)} against ${esc(my.label)}</h4><div class="none">No controller has both results yet.</div>`;return;}
 const rng=(vals,m)=>{let lo=Math.min(...vals),hi=Math.max(...vals);if(m.score){lo=Math.min(lo,0);hi=Math.max(hi,100);}if(lo===hi){lo-=1;hi+=1;}const pad=(hi-lo)*.08;return[lo-pad,hi+pad];};
 const [x0,x1]=rng(items.map(i=>i.x*k),mx),[y0,y1]=rng(items.map(i=>i.y*ky),my);
 const X=v=>100*(v*k-x0)/(x1-x0),Y=v=>100-100*(v*ky-y0)/(y1-y0);
 if(!card.querySelector(".ch-scat")){card.innerHTML='<h4></h4><div class="hint">Each dot is one controller. Dot colour: result of the first measure.</div><div class="ch-scat"></div>';}
 card.querySelector("h4").textContent=`${mx.label} against ${my.label}`;
 const sc=card.querySelector(".ch-scat");
 sc.querySelectorAll(".ch-tick,.ch-ax").forEach(x=>x.remove());
 for(let i=0;i<=4;i++){const vx=x0+(x1-x0)*i/4,vy=y0+(y1-y0)*i/4;
  sc.insertAdjacentHTML("beforeend",`<span class="ch-tick" style="left:${i*25}%;bottom:-20px;transform:translateX(-50%)">${(+vx.toFixed(vx>=100||mx.score?0:2))}</span><span class="ch-tick" style="left:-48px;top:${100-i*25}%;transform:translateY(-50%)">${(+vy.toFixed(vy>=100||my.score?0:2))}</span>`);}
 sc.insertAdjacentHTML("beforeend",`<span class="ch-ax" style="right:0;bottom:-34px">${esc(mx.label)}${mx.pct?" (%)":""} &rarr;</span><span class="ch-ax" style="left:4px;top:-18px">&uarr; ${esc(my.label)}${my.pct?" (%)":""}</span>`);
 const keep=new Map([...sc.querySelectorAll(".ch-dot")].map(d=>[d.dataset.n,d]));
 const labs=new Map([...sc.querySelectorAll(".ch-lab")].map(d=>[d.dataset.n,d]));
 for(const it of items){
  let dt=keep.get(it.c.name),lb=labs.get(it.c.name);
  if(!dt){dt=document.createElement("span");dt.className="ch-dot";dt.tabIndex=0;dt.dataset.n=it.c.name;dt.style.left="0%";dt.style.top="100%";sc.appendChild(dt);
   lb=document.createElement("span");lb.className="ch-lab";lb.dataset.n=it.c.name;lb.textContent=it.c.name;lb.style.left="0%";lb.style.top="100%";sc.appendChild(lb);}
  keep.delete(it.c.name);labs.delete(it.c.name);
  dt.className="ch-dot "+gradeOf(it.c,chartX);
  lb.style.transform=X(it.x)>65?"translate(calc(-100% - 10px),-50%)":"";
  requestAnimationFrame(()=>{dt.style.left=lb.style.left=X(it.x)+"%";dt.style.top=lb.style.top=Y(it.y)+"%";});
  const tip=`<b>${esc(it.c.name)}</b><br>${esc(mx.label)}: ${esc(show(mx,it.x))}<br>${esc(my.label)}: ${esc(show(my,it.y))}`;
  dt.onmousemove=e=>tipShow(e,tip);dt.onmouseleave=tipHide;dt.onfocus=()=>{const b=dt.getBoundingClientRect();tipShow({clientX:b.right,clientY:b.top},tip);};dt.onblur=tipHide;
 }
 for(const d of keep.values())d.remove();for(const d of labs.values())d.remove();
}

function barSvg(m,items,col){
 const k=m.pct?100:1,L=140,R=70,rowH=26,W=440,plotW=W-L-R;
 let max=Math.max(...items.flatMap(i=>i.vals.map(v=>v*k)));
 for(const t of [m.ok_value,m.watch_value])if(t!=null)max=Math.max(max,t*k);
 if(m.unit==="bits")max=Math.max(max,12);
 if(!(max>0))max=1;max*=1.08;
 const X=v=>L+plotW*Math.max(0,v)/max,H=items.length*rowH+18;
 let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)} by controller">`;
 g+=`<line x1="${L}" x2="${L}" y1="0" y2="${H-18}" stroke="#3a3a40"/>`;
 for(const [t,lab] of [[m.ok_value,"OK"],[m.watch_value,"Watch"]]){if(t==null)continue;const x=X(t*k);
  g+=`<line x1="${x}" x2="${x}" y1="0" y2="${H-18}" stroke="#85858f" stroke-dasharray="3 3"/><text x="${x}" y="${H-5}" text-anchor="middle">${lab}</text>`;}
 items.forEach((it,i)=>{const y=i*rowH+4,bh=14,w=Math.max(4,X(it.v*k)-L);
  const sess=it.ss.slice(0,6).map(s=>`${esc(when(s.started))}: ${fmt(m,s.metrics[m.key])}`).join("<br>");
  const tip=`<b>${fmt(m,it.v)}</b><br>${esc(it.n)}<br><span style="color:#85858f">${cmpMode==="latest"?"Latest session":`Median of ${it.vals.length} session${it.vals.length>1?"s":""}`}</span>${it.vals.length>1?`<br><span style="color:#85858f">${sess}</span>`:""}`;
  g+=`<g tabindex="0" data-tip="${esc(tip)}"><rect x="0" y="${y-4}" width="${W}" height="${rowH}" fill="transparent"/>`;
  g+=`<text x="${L-8}" y="${y+bh-3}" text-anchor="end">${esc(it.n.length>21?it.n.slice(0,20)+"…":it.n)}</text>`;
  g+=`<path d="M${L},${y} h${w-4} a4,4 0 0 1 4,4 v${bh-8} a4,4 0 0 1 -4,4 h-${w-4} z" fill="${col[it.n]}"/>`;
  if(it.vals.length>1)for(const v of it.vals)g+=`<circle cx="${X(v*k)}" cy="${y+bh/2}" r="4" fill="#f2f2f5" stroke="#141416" stroke-width="2"/>`;
  const lx=Math.max(L+w,...(it.vals.length>1?it.vals.map(v=>X(v*k)+4):[0]))+8;
  g+=`<text class="v" x="${lx}" y="${y+bh-3}">${fmt(m,it.v)}</text></g>`;});
 return g+"</svg>";
}
