[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "padmaster"
version = "0.1.2"
description = "Log a game controller in the background while you play, then get a report on deadzones, drift, D-pad flicker and double inputs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5.8,<2.6", "pywebview>=6.2,<7"]

[project.scripts]
padlab = "padlab.cli:main"
padmaster = "padlab.cli:main"

[tool.setuptools]
packages = ["padlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
padlab = ["logo_128.png", "app.html", "gamepadla_latency.json"]
